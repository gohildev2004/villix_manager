services:
  - type: web
    name: villix-manager
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.1
      - key: VILLIX_ENVIRONMENT
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://mohhdiirylnaccilrydn.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: RAZORPAYX_KEY_ID
        sync: false
      - key: RAZORPAYX_KEY_SECRET
        sync: false
      - key: RAZORPAYX_ACCOUNT_NUMBER
        sync: false
      - key: RAZORPAYX_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAYX_WEBHOOK_PREVIOUS_SECRET
        sync: false
      - key: RAZORPAYX_PAYOUT_MODE
        value: NEFT
      - key: PAYEE_PORTAL_ORIGIN
        value: https://contributor.villix.in
      - key: NEXT_PUBLIC_CONTRIBUTOR_PORTAL_URL
        value: https://contributor.villix.in
      - key: INVITATION_SMTP_HOST
        value: smtp.gmail.com
      - key: INVITATION_SMTP_PORT
        value: "465"
      - key: INVITATION_SMTP_USER
        sync: false
      - key: INVITATION_SMTP_PASSWORD
        sync: false
      - key: INVITATION_FROM_EMAIL
        sync: false
      - key: INVITATION_FROM_NAME
        value: Villix
      - key: RAZORPAYX_VENDOR_PORTAL_ENABLED
        value: "false"
      - key: RAZORPAYX_VENDOR_PORTAL_URL
        value: https://x.razorpay.com/vendor-portal/
      - key: RAZORPAYX_DIRECT_BANK_FORM_ENABLED
        value: "false"
      - key: PAYOUTS_LIVE_ENABLED
        value: "false"
