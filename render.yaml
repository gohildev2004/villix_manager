services:
  - type: web
    name: villix-manager
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.1
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://mohhdiirylnaccilrydn.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: RAZORPAYX_KEY_ID
        sync: false
      - key: RAZORPAYX_KEY_SECRET
        sync: false
      - key: RAZORPAYX_ACCOUNT_NUMBER
        sync: false
      - key: RAZORPAYX_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAYX_WEBHOOK_PREVIOUS_SECRET
        sync: false
      - key: RAZORPAYX_PAYOUT_MODE
        value: NEFT
      - key: PAYOUTS_LIVE_ENABLED
        value: "false"
